version: "3.8"

services:
  db:
    image: postgres:17.4
    container_name: db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - local_pgdata:/var/lib/postgresql/data
    networks:
      - backend                # tylko sieć wewnętrzna

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@test.com
      PGADMIN_DEFAULT_PASSWORD: admin
      MFA_ENABLED: true
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - backend                # łączy się z db
      - frontend               # i jest dostępny dla świata
          
volumes:
  local_pgdata:
  pgadmin-data:

networks:
  backend:
    driver: bridge
    # internal: true            # wskazanie i db będzie internalowe
  frontend:
    driver: bridge            # sięć mostkowa
